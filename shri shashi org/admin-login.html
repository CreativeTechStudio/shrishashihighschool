<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login | श्री शशि हाई स्कूल गोरसी</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root{--navy:#0B2545;--gold:#C9972A;--gold2:#F0BE5A;--saffron:#E8721C;--cream:#FDF6E9;--gray:#6B7280;--red:#EF4444;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#07192e 0%,#0B2545 50%,#132a4a 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;}
    .back-link{color:rgba(255,255,255,0.6);font-size:.85rem;text-decoration:none;display:flex;align-items:center;gap:.4rem;margin-bottom:1.5rem;}
    .back-link:hover{color:#fff;}
    .login-box{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:430px;overflow:hidden;}
    .login-header{background:linear-gradient(135deg,#07192e,#0B2545);padding:2.2rem 2rem;text-align:center;border-bottom:2px solid var(--gold);}
    .login-icon{width:68px;height:68px;border-radius:50%;background:rgba(201,151,42,0.15);border:2px solid rgba(201,151,42,0.4);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:1.9rem;}
    .login-header h1{color:#fff;font-family:'Playfair Display',serif;font-size:1.35rem;margin-bottom:.3rem;}
    .login-header p{color:rgba(255,255,255,0.5);font-size:.82rem;}

    .tabs{display:flex;background:#f3f4f6;}
    .tab-btn{flex:1;padding:.9rem;background:none;border:none;font-size:.85rem;font-weight:600;color:var(--gray);cursor:pointer;font-family:'Poppins',sans-serif;border-bottom:3px solid transparent;transition:all .2s;}
    .tab-btn.active{color:var(--navy);background:#fff;border-bottom-color:var(--gold);}

    .tab-panel{display:none;}
    .tab-panel.active{display:block;}

    .login-body{padding:1.8rem 2rem 2rem;}
    .form-group{margin-bottom:1.1rem;}
    .form-label{display:block;font-size:.77rem;font-weight:600;color:var(--navy);margin-bottom:.4rem;}
    .form-input{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:.72rem 1rem;font-size:.88rem;font-family:'Poppins',sans-serif;color:var(--navy);background:var(--cream);transition:all .2s;}
    .form-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,151,42,0.12);background:#fff;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--gray);font-size:.88rem;}
    .form-input.wi{padding-left:2.7rem;}
    .toggle-pass{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray);cursor:pointer;font-size:.88rem;}
    .btn-login{width:100%;background:linear-gradient(135deg,#07192e,#0B2545);color:#fff;border:none;padding:.85rem;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer;font-family:'Poppins',sans-serif;transition:all .2s;margin-top:.3rem;display:flex;align-items:center;justify-content:center;gap:.5rem;}
    .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(7,25,46,0.4);}
    .btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .btn-signup{background:linear-gradient(135deg,var(--saffron),#c45e10);}
    .error-box{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:9px;padding:.65rem 1rem;font-size:.8rem;color:#DC2626;margin-top:.7rem;display:none;}
    .success-box{background:#F0FFF4;border:1px solid #6EE7B7;border-radius:9px;padding:.65rem 1rem;font-size:.8rem;color:#065F46;margin-top:.7rem;display:none;}
    .key-hint{background:#FFFBEB;border:1px solid #FCD34D;border-radius:9px;padding:.7rem 1rem;font-size:.76rem;color:#92400E;margin-bottom:1.1rem;line-height:1.5;}
    .spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .login-footer{text-align:center;padding:1.1rem;border-top:1px solid #F3F4F6;font-size:.78rem;color:var(--gray);}
    .login-footer a{color:var(--saffron);font-weight:600;text-decoration:none;}
  </style>
</head>
<body>
  <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
  <div class="login-box">
    <div class="login-header">
      <div class="login-icon">🛡️</div>
      <h1>Admin Panel</h1>
      <p>School Administration Access</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="tabSignupBtn" onclick="switchTab('signup')">Create Account</button>
    </div>

    <!-- LOGIN TAB -->
    <div class="tab-panel active" id="panelLogin">
      <div class="login-body">
        <div class="form-group">
          <label class="form-label">Admin Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input class="form-input wi" type="email" id="loginEmail" placeholder="admin@shrishashi.in"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input class="form-input wi" type="password" id="loginPass" placeholder="Enter password"/>
            <button class="toggle-pass" onclick="togglePass('loginPass',this)" type="button"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="error-box" id="loginErr"></div>
        <button class="btn-login" id="loginBtn" onclick="doLogin()">
          <span id="loginText">Login to Dashboard</span>
          <div class="spinner" id="loginSpinner"></div>
        </button>
      </div>
      <div class="login-footer">Student? <a href="student-login.html">Student Login →</a></div>
    </div>

    <!-- SIGNUP TAB -->
    <div class="tab-panel" id="panelSignup">
      <div class="login-body">
        <div class="key-hint">
          🔑 <strong>Admin Secret Key chahiye.</strong> Yeh key sirf authorized logon ke paas honi chahiye — isse koi bhi naya admin account bana sakta hai.
        </div>
        <div class="form-group">
          <label class="form-label">Admin Secret Key</label>
          <div class="input-wrap">
            <i class="fas fa-key input-icon"></i>
            <input class="form-input wi" type="password" id="signupKey" placeholder="Enter secret key"/>
            <button class="toggle-pass" onclick="togglePass('signupKey',this)" type="button"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Your Name</label>
          <div class="input-wrap">
            <i class="fas fa-user input-icon"></i>
            <input class="form-input wi" type="text" id="signupName" placeholder="Full name"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Gmail / Email</label>
          <div class="input-wrap">
            <i class="fas fa-envelope input-icon"></i>
            <input class="form-input wi" type="email" id="signupEmail" placeholder="youremail@gmail.com"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Set Password (min 6 characters)</label>
          <div class="input-wrap">
            <i class="fas fa-lock input-icon"></i>
            <input class="form-input wi" type="password" id="signupPass" placeholder="Create password"/>
            <button class="toggle-pass" onclick="togglePass('signupPass',this)" type="button"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="error-box" id="signupErr"></div>
        <div class="success-box" id="signupSuccess"></div>
        <button class="btn-login btn-signup" id="signupBtn" onclick="doSignup()">
          <span id="signupText">Create Admin Account</span>
          <div class="spinner" id="signupSpinner"></div>
        </button>
      </div>
      <div class="login-footer">Already have an account? <a href="#" onclick="switchTab('login');return false;">Login →</a></div>
    </div>

  </div>

<script src="api-config.js"></script>
<script>
  function switchTab(tab) {
    document.getElementById('tabLoginBtn').classList.toggle('active', tab==='login');
    document.getElementById('tabSignupBtn').classList.toggle('active', tab==='signup');
    document.getElementById('panelLogin').classList.toggle('active', tab==='login');
    document.getElementById('panelSignup').classList.toggle('active', tab==='signup');
  }

  function togglePass(id, btn) {
    const inp = document.getElementById(id);
    inp.type = inp.type==='password' ? 'text' : 'password';
    btn.innerHTML = inp.type==='password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
  }

  (async function checkExisting() {
    const token = localStorage.getItem('sshs_token');
    const role = localStorage.getItem('sshs_role');
    if (token && role === 'admin') {
      try {
        await apiFetch('/api/admin/me');
        window.location.href = 'admin-panel.html';
      } catch(e) {
        localStorage.removeItem('sshs_token');
        localStorage.removeItem('sshs_role');
      }
    }
  })();

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    const err   = document.getElementById('loginErr');
    const btn   = document.getElementById('loginBtn');
    const spin  = document.getElementById('loginSpinner');
    const txt   = document.getElementById('loginText');
    err.style.display = 'none';

    if (!email || !pass) { err.textContent='⚠ Email and password required'; err.style.display='block'; return; }

    btn.disabled=true; spin.style.display='block'; txt.textContent='Logging in...';
    try {
      const data = await apiFetch('/api/admin/login', { method:'POST', body: JSON.stringify({ email, password: pass }) });
      localStorage.setItem('sshs_token', data.token);
      localStorage.setItem('sshs_role', 'admin');
      localStorage.setItem('sshs_admin_email', data.admin.email);
      window.location.href = 'admin-panel.html';
    } catch(e) {
      err.textContent = '❌ ' + e.message;
      err.style.display = 'block';
    }
    btn.disabled=false; spin.style.display='none'; txt.textContent='Login to Dashboard';
  }

  async function doSignup() {
    const secretKey = document.getElementById('signupKey').value;
    const name      = document.getElementById('signupName').value.trim();
    const email     = document.getElementById('signupEmail').value.trim();
    const pass      = document.getElementById('signupPass').value;
    const err       = document.getElementById('signupErr');
    const success   = document.getElementById('signupSuccess');
    const btn       = document.getElementById('signupBtn');
    const spin      = document.getElementById('signupSpinner');
    const txt       = document.getElementById('signupText');
    err.style.display='none'; success.style.display='none';

    if (!secretKey || !email || !pass) { err.textContent='⚠ Secret key, email and password required'; err.style.display='block'; return; }
    if (pass.length < 6) { err.textContent='⚠ Password must be at least 6 characters'; err.style.display='block'; return; }

    btn.disabled=true; spin.style.display='block'; txt.textContent='Creating account...';
    try {
      const data = await apiFetch('/api/admin/signup', { method:'POST', body: JSON.stringify({ secretKey, name, email, password: pass }) });
      localStorage.setItem('sshs_token', data.token);
      localStorage.setItem('sshs_role', 'admin');
      localStorage.setItem('sshs_admin_email', data.admin.email);
      success.textContent = '✅ Account created! Redirecting to dashboard...';
      success.style.display = 'block';
      setTimeout(()=> window.location.href='admin-panel.html', 1200);
    } catch(e) {
      err.textContent = '❌ ' + e.message;
      err.style.display = 'block';
      btn.disabled=false; spin.style.display='none'; txt.textContent='Create Admin Account';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panelLogin').classList.contains('active')) doLogin();
    else doSignup();
  });
</script>
</body>
</html>
