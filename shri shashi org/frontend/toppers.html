<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Toppers | श्री शशि हाई स्कूल गोरसी</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* SEARCH */
    .search-section {
      background: #fff;
      padding: 1.2rem 2rem;
      box-shadow: 0 2px 12px rgba(11, 37, 69, 0.08);
    }

    .search-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .search-box {
      position: relative;
      max-width: 560px;
    }

    .search-input {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: .8rem 1rem .8rem 3rem;
      font-size: .92rem;
      font-family: 'Poppins', sans-serif;
      color: var(--navy);
      background: var(--cream);
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gold);
      background: #fff;
    }

    .search-ico {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
    }

    .search-clr {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      display: none;
    }

    .search-info {
      font-size: .8rem;
      color: var(--gray);
      margin-top: .5rem;
    }

    .search-info span {
      color: var(--saffron);
      font-weight: 600;
    }

    /* FILTER */
    .filter-bar {
      background: #f8f9ff;
      padding: 1rem 2rem;
      border-bottom: 1px solid #E5E7EB;
      position: sticky;
      top: 72px;
      z-index: 99;
    }

    .filter-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      gap: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      flex: 1;
      min-width: 140px;
    }

    .fl {
      font-size: .72rem;
      font-weight: 600;
      color: var(--gray);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .fs {
      border: 1.5px solid #E5E7EB;
      border-radius: 9px;
      padding: .6rem 1rem;
      font-size: .87rem;
      font-family: 'Poppins', sans-serif;
      color: var(--navy);
      background: #fff;
      cursor: pointer;
    }

    .fs:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn-reset {
      background: none;
      border: 1.5px solid #E5E7EB;
      border-radius: 9px;
      padding: .6rem 1.2rem;
      font-size: .83rem;
      color: var(--gray);
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: var(--transition);
    }

    .btn-reset:hover {
      border-color: var(--saffron);
      color: var(--saffron);
    }

    .filter-count {
      background: var(--navy);
      color: #fff;
      padding: .3rem .8rem;
      border-radius: 20px;
      font-size: .73rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* MAIN */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* SEARCH HIGHLIGHT */
    .search-hl {
      background: #FFFBEB;
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: none;
    }

    .search-hl.show {
      display: block;
    }

    .hl-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: .8rem;
    }

    /* SESSION */
    .sess-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0 1rem;
    }

    .sess-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--navy);
      white-space: nowrap;
    }

    .sess-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--gold), transparent);
    }

    .sess-badge {
      background: var(--navy);
      color: var(--gold2);
      padding: .2rem .7rem;
      border-radius: 20px;
      font-size: .7rem;
      font-weight: 600;
    }

    .class-lbl {
      font-size: .78rem;
      font-weight: 600;
      color: var(--saffron);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin: 1.2rem 0 .7rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .class-lbl::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }

    /* GRID */
    .t-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    /* CARD */
    .t-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 1.4rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      transition: var(--transition);
      cursor: pointer;
      overflow: hidden;
      border-top: 3px solid #E5E7EB;
    }

    .t-card.r1 {
      border-top-color: #FFD700;
    }

    .t-card.r2 {
      border-top-color: #C0C0C0;
    }

    .t-card.r3 {
      border-top-color: #CD7F32;
    }

    .t-card.match {
      border: 2px solid var(--gold);
      background: #fffbf0;
    }

    .t-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 35px rgba(11, 37, 69, 0.18);
    }

    /* HOVER OVERLAY */
    .t-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(11, 37, 69, 0.95), rgba(19, 57, 94, 0.95));
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity .3s;
      z-index: 2;
    }

    .t-card:hover .t-overlay {
      opacity: 1;
    }

    .ov-name {
      color: var(--gold2);
      font-size: .9rem;
      font-weight: 700;
      margin-bottom: .3rem;
      text-align: center;
    }

    .ov-pct {
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      font-weight: 700;
      margin: .3rem 0;
    }

    .ov-detail {
      color: rgba(255, 255, 255, 0.72);
      font-size: .75rem;
      text-align: center;
      line-height: 1.6;
    }

    .ov-badge {
      background: var(--saffron);
      color: #fff;
      padding: .15rem .6rem;
      border-radius: 20px;
      font-size: .68rem;
      font-weight: 600;
      margin-top: .4rem;
    }

    /* FRONT */
    .t-rank-emoji {
      font-size: 1.4rem;
      margin-bottom: .4rem;
    }

    .t-photo {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      margin: 0 auto .7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      font-family: 'Playfair Display', serif;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .t-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .t-name {
      font-size: .85rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: .2rem;
      line-height: 1.3;
    }

    .t-cls {
      font-size: .7rem;
      color: var(--gray);
      margin-bottom: .4rem;
    }

    .t-pct {
      font-family: 'Playfair Display', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--gold);
    }

    .t-rnk {
      font-size: .7rem;
      color: var(--gray);
      margin-top: .2rem;
    }

    .t-special {
      font-size: .65rem;
      background: #FEF3C7;
      color: #92400E;
      padding: .1rem .5rem;
      border-radius: 4px;
      margin-top: .3rem;
      display: inline-block;
      font-weight: 600;
    }

    .add-photo {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .55rem;
      z-index: 3;
    }

    /* VIEW MORE */
    .view-more-row {
      text-align: center;
      margin: .8rem 0 1.5rem;
    }

    .btn-expand {
      background: none;
      border: 1.5px solid var(--gold);
      color: var(--gold);
      padding: .5rem 1.8rem;
      border-radius: 20px;
      font-size: .83rem;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      transition: var(--transition);
    }

    .btn-expand:hover {
      background: var(--gold);
      color: var(--navy);
    }

    /* NO RESULT */
    .no-res {
      background: #FFF8E7;
      border: 1.5px solid var(--gold);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      margin-bottom: 2rem;
    }

    .empty {
      text-align: center;
      padding: 4rem;
      color: var(--gray);
    }

    @media(max-width:600px) {
      .t-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .filter-inner {
        flex-direction: column;
      }
    }
  </style>
</head>

    const PREVIEW = 10;
    let expanded = {};

    function getRankEmoji(r) { return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : '#' + r; }
    function getInitials(n) { return n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(); }
    function sortAndRank(arr) {
      const s = [...arr].sort((a, b) => b.percent - a.percent);
      let rank = 1;
      s.forEach((x, i) => { if (i > 0 && x.percent < s[i - 1].percent) rank = i + 1; x.rank = rank; });
      return s;
    }

    function makeCard(st, session, cls, match = false) {
      const ini = getInitials(st.name);
      const ph = st.photo ? `<img src="${st.photo}" alt="${st.name}" onerror="this.style.display='none'">` : '';
      const rc = st.rank <= 3 ? `r${st.rank}` : '';
      return `<div class="t-card ${rc} ${match ? 'match' : ''} fade-up">
    <div class="t-overlay">
      <div class="ov-name">${st.name}</div>
      <div class="ov-pct">${st.percent}%</div>
      <div class="ov-detail">Class ${cls}th | Session ${session}<br/>Rank: ${st.rank}${st.special ? '<br/>' + st.special : ''}</div>
      ${st.special ? `<span class="ov-badge">${st.special}</span>` : ''}
    </div>
    <div class="t-rank-emoji">${getRankEmoji(st.rank)}</div>
    <div class="t-photo" style="background:${st.color}" title="Photo: images/toppers/${st.name.toLowerCase().replace(/ /g, '-')}.jpg">
      ${ph}<span style="display:${st.photo ? 'none' : 'flex'};width:100%;height:100%;align-items:center;justify-content:center">${ini}</span>
      <span class="add-photo">📷</span>
    </div>
    <div class="t-name">${st.name}</div>
    <div class="t-cls">Class ${cls}th</div>
    <div class="t-pct">${st.percent}%</div>
    <div class="t-rnk">Rank ${st.rank}${st.special ? ' • ' + st.special : ''}</div>
  </div>`;
    }

    function render() {
      const sF = document.getElementById('sessionFilter').value;
      const cF = document.getElementById('classFilter').value;
      const cont = document.getElementById('mainContent');
      let html = '', total = 0;
      const sessions = ['2026-27', '2025-26', '2024-25', '2023-24'];
      sessions.forEach(sess => {
        if (sF !== 'all' && sF !== sess) return;
        if (sess === '2026-27') {
          if (sF === 'all' || sF === '2026-27')
            html += `<div class="sess-header"><span class="sess-title">Session 2026-27</span><div class="sess-line"></div><span class="sess-badge">Upcoming</span></div>
        <div class="no-res"><div style="font-size:2rem;margin-bottom:.5rem">⏳</div><h3 style="color:var(--navy)">Results Not Declared Yet</h3><p style="color:var(--gray);font-size:.85rem;margin-top:.3rem">परिणाम घोषित होने के बाद यहाँ अपडेट किया जाएगा।</p></div>`;
          return;
        }
        const sd = TOPPERS[sess]; if (!sd) return;
        let hasContent = false;
        ['5', '6', '7', '8'].forEach(c => { if ((cF === 'all' || cF === c) && sd[c] && sd[c].length) hasContent = true; });
        if (!hasContent) return;
        html += `<div class="sess-header"><span class="sess-title">Session ${sess}</span><div class="sess-line"></div><span class="sess-badge">MP Board</span></div>`;
        ['5', '6', '7', '8'].forEach(cls => {
          if (cF !== 'all' && cF !== cls) return;
          if (!sd[cls] || !sd[cls].length) return;
          const sorted = sortAndRank(sd[cls]);
          const key = `${sess}-${cls}`;
          const isExp = expanded[key];
          const show = isExp ? sorted.length : Math.min(PREVIEW, sorted.length);
          const hasMore = sorted.length > PREVIEW;
          total += sorted.length;
          html += `<div class="class-lbl">📚 Class ${cls}th — ${sorted.length} Students</div><div class="t-grid">`;
          for (let i = 0; i < show; i++)html += makeCard(sorted[i], sess, cls);
          html += `</div>`;
          if (hasMore && !isExp) html += `<div class="view-more-row"><button class="btn-expand" onclick="expandSec('${sess}','${cls}')"><i class="fas fa-chevron-down" style="font-size:.7rem"></i> View All ${sorted.length} Students</button></div>`;
        });
      });
      if (!html) html = `<div class="empty"><div style="font-size:3rem;margin-bottom:1rem">🔍</div><h3>No Data Found</h3></div>`;
      cont.innerHTML = html;
      document.getElementById('filterCount').textContent = total > 0 ? total + ' Students' : 'No Data';
    }

    window.expandSec = function (sess, cls) { expanded[`${sess}-${cls}`] = true; render(); };
    function applyFilter() { expanded = {}; render(); }
    function resetFilter() {
      document.getElementById('sessionFilter').value = 'all';
      document.getElementById('classFilter').value = 'all';
      expanded = {}; clearSearch(); render();
    }

    function doSearch(q) {
      const query = q.toLowerCase().trim();
      const clr = document.getElementById('searchClr');
      const hl = document.getElementById('searchHl');
      const info = document.getElementById('searchInfo');
      clr.style.display = q ? 'block' : 'none';
      if (!query) { hl.classList.remove('show'); info.innerHTML = ''; return; }
      let results = [];
      ['2025-26', '2024-25', '2023-24'].forEach(sess => {
        const sd = TOPPERS[sess]; if (!sd) return;
        ['5', '6', '7', '8'].forEach(cls => {
          if (!sd[cls]) return;
          sortAndRank([...sd[cls]]).forEach(st => {
            if (st.name.toLowerCase().includes(query)) results.push({ ...st, session: sess, cls });
          });
        });
      });
      results.sort((a, b) => b.percent - a.percent);
      if (results.length) {
        hl.classList.add('show');
        document.getElementById('searchGrid').innerHTML = results.map(s => makeCard(s, s.session, s.cls, true)).join('');
        info.innerHTML = `<span>${results.length} result${results.length > 1 ? 's' : ''}</span> found for "<strong>${q}</strong>"`;
        hl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        hl.classList.remove('show');
        info.innerHTML = `No results found for "<strong>${q}</strong>"`;
      }
    }
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchClr').style.display = 'none';
      document.getElementById('searchHl').classList.remove('show');
      document.getElementById('searchInfo').innerHTML = '';
    }

    render();
  </script>
